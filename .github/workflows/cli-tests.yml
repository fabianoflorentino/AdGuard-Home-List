name: "CLI - NodeJS Tests"

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./modules/cli

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/cli/package-lock.json

      - name: Install, build, and test
        run: |
          npm ci
          npm run build
        env:
          CI: true
