name: Publish lists

on:
  push:
    branches:
      - "main"
    paths:
      - "allowlist/**"
      - "blocklist/**"
      - "modules/cli/**"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modules/cli/package-lock.json

      - name: Install & Build
        run: |
          mkdir -p public
          cd ./modules/cli
          npm ci
          npm run build
        env:
          CI: true

      - name: Generate AllowList
        run: |
          node ./modules/cli/dist/main.js generate \
            --name AdGuard-Home-List.Allow.txt \
            --badge badge-allow.json \
            --external ./allowlist/external \
            --custom ./allowlist/custom \
            --concatExternal ./allowlist/concat \
            --convertToAllow true \
            --output ./public

      - name: Generate BlockList
        run: |
          node ./modules/cli/dist/main.js generate \
            --name AdGuard-Home-List.Block.txt \
            --badge badge-block.json \
            --external ./blocklist/external \
            --custom ./blocklist/custom \
            --concatExternal ./blocklist/concat \
            --output ./public

      - name: Validate generated files
        run: |
          test -s public/AdGuard-Home-List.Allow.txt
          test -s public/AdGuard-Home-List.Block.txt
          node -e "for (const file of ['public/badge-allow.json', 'public/badge-block.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'));"

      - name: Add GitHub Pages site
        run: |
          cp -R ./site/. ./public/
          cp ./LICENSE.txt ./public/LICENSE.txt
          touch ./public/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: public
          clean: true
          single-commit: true
          commit-message: "deploy: publish lists and site"
