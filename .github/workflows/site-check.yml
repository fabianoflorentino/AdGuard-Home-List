name: Site checks

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".htmlvalidate.json"
      - ".github/workflows/site-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "site/**"
      - ".htmlvalidate.json"
      - ".github/workflows/site-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check site/script.js

      - name: Validate HTML
        run: npx --yes html-validate@9 site/index.html site/404.html
