<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Illustrative AdGuard Home DNS allowlists screen">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f0e" />
      <stop offset="1" stop-color="#050807" />
    </linearGradient>
    <style>
      .ui { font-family: "Share Tech Mono", Consolas, monospace; }
      .title { font-size: 20px; fill: #e9fff6; font-weight: 700; }
      .sub { font-size: 13px; fill: #7b918a; }
      .label { font-size: 13px; fill: #a9c0b8; }
      .nav { font-size: 14px; fill: #7b918a; }
      .nav-on { font-size: 14px; fill: #39ff9a; }
      .mono { font-size: 12px; fill: #8aa39a; }
      .note { font-size: 14px; fill: #39ff9a; font-weight: 700; letter-spacing: 1px; }
      .panel { fill: #07100d; stroke: #39ff9a; stroke-opacity: 0.18; }
      .divider { stroke: #39ff9a; stroke-opacity: 0.12; }
      .btn { fill: #39ff9a; }
      .btn-text { font-size: 13px; fill: #00150d; font-weight: 700; letter-spacing: 1px; }
      .row { fill: #081411; stroke: #39ff9a; stroke-opacity: 0.22; }
      .pill { fill: #0b2a1d; stroke: #39ff9a; stroke-opacity: 0.35; }
      .pill-text { font-size: 11px; fill: #39ff9a; }
      .switch { fill: #39ff9a; }
      .circle { fill: #39ff9a; }
      .circle-text { font-size: 13px; fill: #00150d; font-weight: 700; }
      .callout { fill: none; stroke: #39ff9a; stroke-opacity: 0.45; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1000" height="600" fill="#040706" />
  <text x="32" y="34" class="ui note">ILLUSTRATIVE UI · ADGUARD HOME → FILTERS → DNS ALLOWLISTS</text>

  <g transform="translate(32, 56)">
    <rect width="936" height="500" rx="8" fill="url(#page)" stroke="#39ff9a" stroke-opacity="0.22" />

    <!-- top bar -->
    <rect width="936" height="54" rx="8" fill="#060d0b" stroke="#39ff9a" stroke-opacity="0.16" />
    <circle cx="26" cy="27" r="5" fill="#ff5f57" />
    <circle cx="44" cy="27" r="5" fill="#febc2e" />
    <circle cx="62" cy="27" r="5" fill="#28c840" />
    <text x="86" y="32" class="ui mono">adguard-home.local / filters</text>
    <text x="820" y="32" class="ui mono">v0.107 · admin</text>

    <!-- sidebar -->
    <rect x="0" y="54" width="220" height="446" fill="#06100d" />
    <line x1="220" y1="54" x2="220" y2="500" class="divider" />
    <text x="24" y="96" class="ui nav">Dashboard</text>
    <text x="24" y="132" class="ui nav">Query Log</text>
    <text x="24" y="168" class="ui nav">Settings</text>
    <rect x="12" y="184" width="196" height="32" rx="4" fill="#0b2a1d" stroke="#39ff9a" stroke-opacity="0.34" />
    <text x="24" y="204" class="ui nav-on">Filters</text>
    <text x="24" y="240" class="ui nav">Clients</text>
    <text x="24" y="470" class="ui mono">status: running</text>

    <!-- main -->
    <text x="252" y="106" class="ui title">DNS allowlists</text>
    <text x="252" y="132" class="ui sub">Allowlisted domains are never filtered by AdGuard Home.</text>

    <!-- add button -->
    <g transform="translate(704, 86)">
      <rect class="btn" width="200" height="38" rx="3" />
      <text x="28" y="24" class="ui btn-text">+ ADD ALLOWLIST</text>
      <circle cx="218" cy="-10" r="14" class="circle" />
      <text x="213.5" y="-5" class="ui circle-text">1</text>
    </g>

    <!-- list row -->
    <g transform="translate(252, 174)">
      <rect class="row" width="652" height="118" rx="4" />
      <text x="22" y="34" class="ui label">AdGuard Home List</text>
      <rect class="pill" x="166" y="19" width="82" height="22" rx="3" />
      <text x="178" y="34" class="ui pill-text">allowlist</text>
      <text x="22" y="62" class="ui mono">https://raw.githubusercontent.com/fabianoflorentino/.../AdGuard-Home-List.Allow.txt</text>
      <text x="22" y="88" class="ui mono">3,116 rules · updated daily 04:00 UTC</text>

      <!-- switch -->
      <rect x="596" y="68" width="34" height="18" rx="9" class="switch" />
      <circle cx="621" cy="77" r="7" fill="#00150d" />
      <text x="536" y="82" class="ui mono">enabled</text>
    </g>

    <!-- annotations -->
    <g transform="translate(252, 322)">
      <circle cx="16" cy="-16" r="14" class="circle" />
      <text x="11.5" y="-11" class="ui circle-text">2</text>
      <text x="42" y="-11" class="ui label">Paste the raw AllowList URL in the "Add allowlist" dialog.</text>

      <circle cx="16" cy="26" r="14" class="circle" />
      <text x="11.5" y="31" class="ui circle-text">3</text>
      <text x="42" y="31" class="ui label">Save, then click "Check for updates" to load it immediately.</text>
    </g>

    <!-- footer hint -->
    <text x="252" y="430" class="ui mono">Tip: the BlockList is optional and can be added the same way under DNS blocklists.</text>
  </g>
</svg>
